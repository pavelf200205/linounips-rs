[package]
name = "lino"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"

[features]
default = []
cuda = ["burn/cuda"]

[dependencies]
anyhow = "1"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu", "vulkan", "flex", "fusion", "autotune", "extension"] }
burn-backend = { version = "=0.22.0", default-features = false }
burn-cubecl = { version = "=0.22.0", default-features = false, features = ["std", "fusion"] }
burn-fusion = { version = "=0.22.0", default-features = false, features = ["std"] }
cubek = { version = "=0.3.0", default-features = false, features = ["attention"] }
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "vulkan", "persistence"] }
cubecl-environment = { version = "=0.11.0", default-features = false, features = ["std", "persistence"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
safetensors = "0.6"
half = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
cubecl-environment = { path = "vendor/cubecl-environment" }
